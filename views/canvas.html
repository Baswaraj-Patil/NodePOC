<!--
  Pricing Engine UI rendered inside the Salesforce Canvas iframe.
  Server-side, server.js replaces __SIGNED_REQUEST_JSON__ with the verified
  Canvas payload (OAuth token + record context) before sending this HTML.
-->
<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Pricing Engine</title>
  <link rel="stylesheet" href="/public/app.css" />

  <!-- Salesforce Canvas SDK: provides Sfdc.canvas.client.ajax for REST calls
       authenticated by the signed-request OAuth token. -->
  <script src="https://login.salesforce.com/canvas/sdk/js/canvas-all.js"></script>
</head>
<body>
  <div class="page">
    <header class="app-header">
      <div class="brand">
        <div class="brand-mark">PE</div>
        <div class="brand-text">
          <h1>Pricing Engine</h1>
          <p class="subtitle">External pricing app &middot; Salesforce Canvas</p>
        </div>
      </div>
      <div class="opp-meta">
        <span class="meta-label">Account Name</span>
        <span id="headerAccountName" class="meta-value meta-value--name">Loading&hellip;</span>
      </div>
    </header>

    <!-- Status toast; populated by showMessage() with info/success/error variants. -->
    <div id="message" class="toast" hidden></div>

    <!-- Opportunity context card: display-only mirror of fields read from Salesforce. -->
    <section class="card">
      <div class="card-head">
        <h2>Opportunity</h2>
        <span class="card-hint">Read-only fields from Salesforce</span>
      </div>

      <div class="form-grid">
        <label class="field">
          <span class="field-label">Name</span>
          <input id="oppName" type="text" readonly />
        </label>

        <label class="field">
          <span class="field-label">Stage</span>
          <input id="oppStage" type="text" readonly />
        </label>

        <label class="field">
          <span class="field-label">Amount <em>(rolls up from products)</em></span>
          <input id="oppAmount" type="text" readonly />
        </label>

        <label class="field">
          <span class="field-label">Close Date</span>
          <input id="oppCloseDate" type="text" readonly />
        </label>
      </div>
    </section>

    <!-- Products card: rows populated from the Opportunity's PricebookEntries.
         Selected rows + quantities are written back as OpportunityLineItems on Submit. -->
    <section class="card">
      <div class="card-head">
        <h2>Products</h2>
        <span class="card-hint">Select products to add as line items</span>
      </div>

      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th class="col-select">Select</th>
              <th>Product</th>
              <th>Unit Price</th>
              <th class="col-qty">Quantity</th>
            </tr>
          </thead>
          <tbody id="productRows">
            <tr class="empty-row"><td colspan="4">Loading products&hellip;</td></tr>
          </tbody>
        </table>
      </div>

      <div class="card-actions">
        <button id="submitBtn" class="btn btn-primary">Add Selected Products</button>
      </div>
    </section>
  </div>

<script>
// __SIGNED_REQUEST_JSON__ is replaced server-side by server.js#renderHtml with
// the decoded Canvas payload. `<` characters inside it are escaped to \u003c
// to keep a malicious value from breaking out of this <script> tag.
const sr = __SIGNED_REQUEST_JSON__;
const client = sr.client;                    // OAuth token + instanceUrl used by Canvas SDK
const context = sr.context || {};
const environment = context.environment || {}; // Holds recordId and other record context

// REST API version is pinned: changes can break field/relationship behavior.
const API = "/services/data/v60.0";

const message = document.getElementById("message");
const productRows = document.getElementById("productRows");
const submitBtn = document.getElementById("submitBtn");

const headerAccountNameEl = document.getElementById("headerAccountName");
const oppNameEl = document.getElementById("oppName");
const oppStageEl = document.getElementById("oppStage");
const oppAmountEl = document.getElementById("oppAmount");
const oppCloseDateEl = document.getElementById("oppCloseDate");

// Render a status toast. `type` is one of "info" | "success" | "error".
function showMessage(text, type) {
  message.hidden = false;
  message.className = "toast toast--" + (type || "info");
  message.innerText = text;
}

function formatCurrency(value) {
  if (value === null || value === undefined || value === "") return "-";
  return "$" + Number(value).toLocaleString();
}

// Defensive resolver for the Opportunity Id. Tries multiple sources because
// Canvas may deliver the record context differently depending on how the
// <apex:canvasApp> is configured (record-page binding vs `parameters="..."`).
// Order: ?id query param  →  environment.recordId  →  environment.record.Id
//        →  environment.parameters (string or JSON)  →  parameters object.
// Every candidate is validated against the `006` Opportunity key prefix to
// reject ids from the wrong sObject type.
function getOpportunityId() {
  const urlParams = new URLSearchParams(window.location.search);

  const idFromUrl = urlParams.get("id");
  if (idFromUrl && idFromUrl.startsWith("006")) {
    return idFromUrl;
  }

  if (environment.recordId && environment.recordId.startsWith("006")) {
    return environment.recordId;
  }

  if (environment.record && environment.record.Id && environment.record.Id.startsWith("006")) {
    return environment.record.Id;
  }

  if (environment.parameters && typeof environment.parameters === "string") {
    if (environment.parameters.startsWith("006")) {
      return environment.parameters;
    }

    // `parameters` is sometimes delivered as HTML-encoded JSON
    // (e.g. {&quot;oppId&quot;:&quot;006...&quot;}); unescape before parsing.
    try {
      const parsed = JSON.parse(environment.parameters.replace(/&quot;/g, '"'));
      if (parsed.oppId && parsed.oppId.startsWith("006")) {
        return parsed.oppId;
      }
    } catch (e) {
      // Swallow parse errors; fall through to remaining lookup paths.
    }
  }

  if (
    environment.parameters &&
    typeof environment.parameters === "object" &&
    environment.parameters.oppId
  ) {
    return environment.parameters.oppId;
  }

  return null;
}

const opportunityId = getOpportunityId();

// Single wrapper around the Canvas SDK REST helper.
// Passing `client` makes every call execute as the logged-in Salesforce user,
// so FLS, sharing rules, validation rules, and required fields all apply.
function canvasAjax(path, method, body, callback) {
  Sfdc.canvas.client.ajax(path, {
    client: client,
    method: method || "GET",
    contentType: "application/json",
    data: body ? JSON.stringify(body) : null,
    success: function(data) {
      callback(null, data.payload);
    },
    failure: function(data) {
      console.error("Canvas AJAX failure:", data);
      callback(data);
    }
  });
}

// Push the Opportunity REST response into the read-only UI fields.
// Account.Name is read via the relationship field on the parent query.
function populateOpportunityForm(opp) {
  headerAccountNameEl.innerText = (opp.Account && opp.Account.Name) || "—";
  oppNameEl.value = opp.Name || "";
  oppStageEl.value = opp.StageName || "";
  oppAmountEl.value = formatCurrency(opp.Amount);
  oppCloseDateEl.value = opp.CloseDate || "";
}

// Re-read Opportunity.Amount after line items are created. Amount is a rollup
// on Salesforce once OLIs exist, so the new value is only visible via a re-fetch.
function refreshAmount() {
  canvasAjax(
    API + "/sobjects/Opportunity/" + encodeURIComponent(opportunityId) + "?fields=Amount",
    "GET",
    null,
    function(err, opp) {
      if (!err) oppAmountEl.value = formatCurrency(opp.Amount);
    }
  );
}

// Page-load entry point: fetch Opportunity context, then trigger product load.
function loadOpportunity() {
  if (!opportunityId) {
    showMessage("Could not determine Opportunity Id from Canvas context or URL.", "error");
    return;
  }

  showMessage("Loading Opportunity\u2026", "info");

  canvasAjax(
    API + "/sobjects/Opportunity/" + encodeURIComponent(opportunityId) +
      "?fields=Id,Name,StageName,Amount,CloseDate,Pricebook2Id,Account.Name",
    "GET",
    null,
    function(err, opp) {
      if (err) {
        showMessage("Failed to read Opportunity. Check browser console.", "error");
        return;
      }

      populateOpportunityForm(opp);

      // Without a Price Book on the Opportunity we cannot list PricebookEntries.
      if (!opp.Pricebook2Id) {
        productRows.innerHTML =
          '<tr class="empty-row"><td colspan="4">No Price Book on this Opportunity. Add the Standard Price Book first.</td></tr>';
        showMessage("Opportunity loaded. Add a Price Book to see products.", "info");
        return;
      }

      loadProducts(opp.Pricebook2Id);
    }
  );
}

// Load active PricebookEntries for the given Pricebook and render product rows.
function loadProducts(pricebookId) {
  // SOQL is built via string interpolation; risk is low because `pricebookId`
  // comes from Salesforce itself (Opportunity.Pricebook2Id), not user input.
  // Could be hardened with bind variables / a typed wrapper if needed.
  const soql =
    "SELECT Id, UnitPrice, Product2.Id, Product2.Name, Product2.ProductCode " +
    "FROM PricebookEntry " +
    "WHERE IsActive = true " +
    "AND Product2.IsActive = true " +
    "AND Pricebook2Id = '" + pricebookId + "' " +
    "ORDER BY Product2.Name";

  canvasAjax(
    API + "/query?q=" + encodeURIComponent(soql),
    "GET",
    null,
    function(err, result) {
      if (err) {
        showMessage("Failed to load products. Check browser console.", "error");
        return;
      }

      if (!result.records || result.records.length === 0) {
        productRows.innerHTML =
          '<tr class="empty-row"><td colspan="4">No active products found for this Price Book.</td></tr>';
        showMessage("Opportunity loaded. No products in this Price Book.", "info");
        return;
      }

      productRows.innerHTML = result.records.map(function(p) {
        return `
          <tr>
            <td class="col-select">
              <input type="checkbox" data-pbe="${p.Id}" data-price="${p.UnitPrice}" />
            </td>
            <td>${escapeHtmlClient(p.Product2.Name)}</td>
            <td>${formatCurrency(p.UnitPrice)}</td>
            <td class="col-qty">
              <input type="number" min="1" value="1" class="qty" data-qty="${p.Id}" />
            </td>
          </tr>
        `;
      }).join("");

      showMessage("Opportunity and products loaded.", "success");
    }
  );
}

// Submit handler: collects checked rows, builds OpportunityLineItem payloads,
// and posts them in a single atomic composite request.
submitBtn.addEventListener("click", function() {
  const selected = Array.from(
    document.querySelectorAll("#productRows input[type='checkbox']:checked")
  );

  if (!selected.length) {
    showMessage("Select at least one product.", "error");
    return;
  }

  // UnitPrice is read straight from the PricebookEntry. In a real build this
  // would come from the external pricing service instead.
  const records = selected.map(function(box) {
    const pbeId = box.dataset.pbe;
    const qtyInput = document.querySelector("[data-qty='" + pbeId + "']");

    return {
      attributes: { type: "OpportunityLineItem" },
      OpportunityId: opportunityId,
      PricebookEntryId: pbeId,
      Quantity: Number(qtyInput.value || 1),
      UnitPrice: Number(box.dataset.price)
    };
  });

  submitBtn.disabled = true;
  showMessage("Adding products to Salesforce\u2026", "info");

  // allOrNone: true → if any record fails, the whole batch is rolled back.
  canvasAjax(
    API + "/composite/sobjects",
    "POST",
    { allOrNone: true, records: records },
    function(err, result) {
      submitBtn.disabled = false;

      if (err) {
        showMessage("Failed to create Opportunity Products. Check browser console.", "error");
        return;
      }

      console.log("Created records:", result);

      // Mark each successfully added row: green highlight + "Added" badge,
      // and lock the checkbox/quantity so it cannot be submitted twice.
      // Note: this only tracks rows added in the current session, not OLIs
      // that already exist on the Opportunity.
      selected.forEach(function(box) {
        const pbeId = box.dataset.pbe;
        const row = box.closest("tr");
        const qtyInput = document.querySelector("[data-qty='" + pbeId + "']");

        box.checked = false;
        box.disabled = true;
        if (qtyInput) qtyInput.disabled = true;

        if (row && !row.querySelector(".added-badge")) {
          row.classList.add("row-added");
          const productCell = row.querySelector("td:nth-child(2)");
          if (productCell) {
            productCell.insertAdjacentHTML("beforeend", ' <span class="added-badge">Added</span>');
          }
        }
      });

      refreshAmount();
      showMessage(
        records.length + " product(s) added. Amount updated. Refresh the Opportunity to confirm.",
        "success"
      );
    }
  );
});

// HTML-entity escape for any Salesforce-sourced text injected into table HTML
// via template literals (currently product names). Prevents stored XSS.
function escapeHtmlClient(value) {
  return String(value || "")
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");
}

// Kick everything off on script execution.
loadOpportunity();
</script>
</body>
</html>
